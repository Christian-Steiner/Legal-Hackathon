[project]
name = "regmonitor-backend"
version = "0.1.0"
description = "Regulatory Change Monitor for LEXR (hackathon MVP) - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
